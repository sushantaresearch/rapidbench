# RAPID-Bench paper grid. Smoke defaults keep only the synthetic substrate on;
# point the real substrates at local files before enabling.
out_dir: results
seeds: [42, 43, 44, 45, 46]
severities: [0.01, 0.05, 0.20]
substrates:
  synthetic: {enabled: true, n: 20000}
  comtrade:  {enabled: false, path: data/comtrade_extract.csv}
  date:      {enabled: true, path: data/date_synthetic.csv}
  ctgan:     {enabled: true, path: data/ctgan_declarations.csv}
validators:
  rules: true
  evidently: true
  gx: false          # enable locally after installing great_expectations
  llm_reviewer: false  # enable with OPENROUTER_API_KEY for E3
